version: 2
updates:
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: gomod
    directories:
    - /
    - /pkg/install
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: helm
    directory: /chart/flux
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
